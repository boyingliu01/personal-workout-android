# =============================================================================
# Design Decisions
# =============================================================================
design_decisions:
  DD-TIMER-001:
    id: "DD-TIMER-001"
    decision: "Use Stopwatch instead of Timer.periodic"
    rationale: "Single instance, no per-screen timer creation"
    source: "PLAN.md Line 98"
    consequence: "Must manage Stopwatch lifecycle manually"
    
  DD-TIMER-002:
    id: "DD-TIMER-002"
    decision: "Use Stream<int> for countdown updates"
    rationale: "Reactive pattern, UI can listen without tight coupling"
    source: "PLAN.md Line 99"
    consequence: "Stream must be closed properly to prevent leaks"
    
  DD-TIMER-003:
    id: "DD-TIMER-003"
    decision: "TimerStatus as enum (not string)"
    rationale: "Type safety, exhaustive switch coverage"
    source: "autoplan Decision #7"
    consequence: "Compiler enforces all status handling"
    
  DD-AUDIO-001:
    id: "DD-AUDIO-001"
    decision: "Preload sound effects at app init"
    rationale: "Instant playback without loading delay"
    source: "PLAN.md Line 94"
    consequence: "Adds ~2MB to app size"
    
  DD-AUDIO-002:
    id: "DD-AUDIO-002"
    decision: "Use audioplayers for effects, flutter_tts for voice"
    rationale: "audioplayers for instant playback, TTS for dynamic text"
    source: "PLAN.md Line 18"
    consequence: "Two audio systems need coordination"
    
  DD-AUDIO-003:
    id: "DD-AUDIO-003"
    decision: "createPlayer() for voice (not cached)"
    rationale: "Voice announcements don't need caching"
    source: "PLAN.md Line 95"
    consequence: "Each speak() creates new player instance"

# =============================================================================
# API Contracts
# =============================================================================
api_contracts:
  TimerService:
    class: "TimerService"
    description: "Singleton service for countdown timer management"
    
    properties:
      countdownStream:
        type: "Stream<int>"
        description: "Emits remaining seconds every tick"
        
      remainingSeconds:
        type: "int"
        description: "Current countdown value"
        
      status:
        type: "TimerStatus"
        description: "Current timer state (enum)"
        
      isRunning:
        type: "bool"
        description: "True if timer is running"
        
      isPaused:
        type: "bool"
        description: "True if timer is paused"
    
    methods:
      start:
        signature: "void start(int durationSeconds)"
        description: "Start countdown from specified duration"
        parameters:
          durationSeconds:
            type: "int"
            description: "Total countdown duration"
            constraints: "Must be > 0"
        effects:
          - "Sets status to running"
          - "Begins countdownStream emission"
          
      pause:
        signature: "void pause()"
        description: "Pause countdown, preserving remaining seconds"
        preconditions:
          - "Timer must be running"
        effects:
          - "Sets status to paused"
          - "Stops stream emission"
          - "Preserves remainingSeconds"
          
      resume:
        signature: "void resume()"
        description: "Resume countdown from paused state"
        preconditions:
          - "Timer must be paused"
        effects:
          - "Sets status to running"
          - "Resumes countdownStream emission"
          
      reset:
        signature: "void reset()"
        description: "Reset timer to idle state"
        effects:
          - "Sets remainingSeconds to 0"
          - "Sets status to idle"
          - "Closes countdownStream"
          
      setOnComplete:
        signature: "void setOnComplete(VoidCallback callback)"
        description: "Set callback for countdown completion"
        parameters:
          callback:
            type: "VoidCallback"
            description: "Function called when countdown reaches 0"

  AudioService:
    class: "AudioService"
    description: "Service for audio playback and TTS announcements"
    
    properties:
      isMuted:
        type: "bool"
        description: "Current mute state"
        
      volume:
        type: "double"
        description: "Current volume level (0.0 - 1.0)"
    
    methods:
      preload:
        signature: "Future<void> preload()"
        description: "Preload all sound effect files"
        effects:
          - "Loads beep.mp3, countdown/*.mp3, complete.mp3"
          
      playBeep:
        signature: "Future<void> playBeep()"
        description: "Play short beep sound"
        effects:
          - "Plays beep.mp3 at current volume"
          
      playCountdown:
        signature: "Future<void> playCountdown(int second)"
        description: "Play countdown voice for specified second"
        parameters:
          second:
            type: "int"
            description: "Second to announce (1-5)"
            constraints: "Must be in range [1, 5]"
        effects:
          - "Plays countdown/{second}.mp3"
          
      speak:
        signature: "Future<void> speak(String text)"
        description: "Convert text to speech"
        parameters:
          text:
            type: "String"
            description: "Text to speak"
        effects:
          - "Uses flutter_tts to speak text"
          
      setVolume:
        signature: "void setVolume(double level)"
        description: "Set audio volume"
        parameters:
          level:
            type: "double"
            description: "Volume level"
            constraints: "Must be in range [0.0, 1.0]"
        effects:
          - "Affects all subsequent playback"
          
      toggleMute:
        signature: "void toggleMute()"
        description: "Toggle mute state"
        effects:
          - "Flips isMuted boolean"
          
      announceExerciseStart:
        signature: "Future<void> announceExerciseStart(String exerciseName)"
        description: "Announce exercise start"
        parameters:
          exerciseName:
            type: "String"
            description: "Name of exercise"
        effects:
          - "Speaks '开始：{exerciseName}'"
          
      announceExerciseComplete:
        signature: "Future<void> announceExerciseComplete()"
        description: "Announce exercise completion"
        effects:
          - "Speaks '动作完成，休息5秒'"
          
      announceRestEnd:
        signature: "Future<void> announceRestEnd()"
        description: "Announce rest period end"
        effects:
          - "Speaks '准备下一个动作'"
          
      announceWorkoutComplete:
        signature: "Future<void> announceWorkoutComplete()"
        description: "Announce workout completion"
        effects:
          - "Speaks '训练完成，真棒！'"

# =============================================================================
# Enums
# =============================================================================
enums:
  TimerStatus:
    values:
      - idle: "Timer not started or reset"
      - running: "Timer actively counting down"
      - paused: "Timer paused, can be resumed"
      - completed: "Timer reached zero"

# =============================================================================
# Edge Cases
# =============================================================================
edge_cases:
  EC-TIMER-001:
    id: "EC-TIMER-001"
    scenario: "start() called when already running"
    expected_behavior: "Reset to new duration, restart countdown"
    
  EC-TIMER-002:
    id: "EC-TIMER-002"
    scenario: "pause() called when not running"
    expected_behavior: "No effect, returns gracefully"
    
  EC-TIMER-003:
    id: "EC-TIMER-003"
    scenario: "resume() called when not paused"
    expected_behavior: "No effect, returns gracefully"
    
  EC-TIMER-004:
    id: "EC-TIMER-004"
    scenario: "start() called with duration = 0"
    expected_behavior: "Immediately triggers onComplete, status = completed"
    
  EC-TIMER-005:
    id: "EC-TIMER-005"
    scenario: "Multiple listeners on countdownStream"
    expected_behavior: "All listeners receive same values"
    
  EC-AUDIO-001:
    id: "EC-AUDIO-001"
    scenario: "playBeep() when muted"
    expected_behavior: "Silent playback, no error"
    
  EC-AUDIO-002:
    id: "EC-AUDIO-002"
    scenario: "speak() called while previous speak() still playing"
    expected_behavior: "Queue or interrupt (implementation choice)"
    
  EC-AUDIO-003:
    id: "EC-AUDIO-003"
    scenario: "preload() fails (file missing)"
    expected_behavior: "Log error, continue with fallback"

