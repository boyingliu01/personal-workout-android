# Runner App Training Services Specification
# Version: 1.0.0
# Date: 2026-04-12
# Source: PLAN.md + autoplan decisions

metadata:
  project: "runner_app"
  module: "Core Services (Timer + Audio)"
  status: "APPROVED"
  approved_by: "delphi-review"
  approved_date: "2026-04-11"

# =============================================================================
# Requirements
# =============================================================================
requirements:
  # TimerService Requirements
  REQ-TIMER-001:
    id: "REQ-TIMER-001"
    name: "Start Countdown Timer"
    description: "User can start a countdown timer for exercise duration tracking"
    priority: "CRITICAL"
    source: "PLAN.md Line 240-244"
    
  REQ-TIMER-002:
    id: "REQ-TIMER-002"
    name: "Pause Timer"
    description: "User can pause the timer during exercise"
    priority: "CRITICAL"
    source: "PLAN.md Line 218-222"
    
  REQ-TIMER-003:
    id: "REQ-TIMER-003"
    name: "Resume Timer"
    description: "User can resume a paused timer"
    priority: "CRITICAL"
    source: "PLAN.md Line 218-222"
    
  REQ-TIMER-004:
    id: "REQ-TIMER-004"
    name: "Reset Timer"
    description: "User can reset timer to initial duration"
    priority: "HIGH"
    source: "PLAN.md Line 387"
    
  REQ-TIMER-005:
    id: "REQ-TIMER-005"
    name: "Stream Countdown Updates"
    description: "Timer emits countdown updates via Stream<int>"
    priority: "CRITICAL"
    source: "PLAN.md Line 99"
    
  REQ-TIMER-006:
    id: "REQ-TIMER-006"
    name: "Single Stopwatch Instance"
    description: "TimerService uses single Stopwatch instance (not per-screen Timer.periodic)"
    priority: "CRITICAL"
    source: "PLAN.md Line 98"
    
  REQ-TIMER-007:
    id: "REQ-TIMER-007"
    name: "Complete Callback"
    description: "Timer triggers callback when countdown reaches zero"
    priority: "HIGH"
    source: "PLAN.md Line 242-244"
    
  REQ-TIMER-008:
    id: "REQ-TIMER-008"
    name: "Get Remaining Seconds"
    description: "Timer provides current remaining seconds value"
    priority: "MEDIUM"
    source: "PLAN.md Line 357"
    
  REQ-TIMER-009:
    id: "REQ-TIMER-009"
    name: "Get Current Status"
    description: "Timer provides current status (idle/running/paused/completed)"
    priority: "MEDIUM"
    source: "PLAN.md Line 71"

  # AudioService Requirements
  REQ-AUDIO-001:
    id: "REQ-AUDIO-001"
    name: "Play Beep Sound"
    description: "Play short beep sound for each second countdown"
    priority: "HIGH"
    source: "PLAN.md Line 241"
    
  REQ-AUDIO-002:
    id: "REQ-AUDIO-002"
    name: "Play Countdown Voice"
    description: "Play voice countdown for last 5 seconds (5,4,3,2,1)"
    priority: "HIGH"
    source: "PLAN.md Line 242"
    
  REQ-AUDIO-003:
    id: "REQ-AUDIO-003"
    name: "Speak Text (TTS)"
    description: "Convert text to speech for announcements"
    priority: "HIGH"
    source: "PLAN.md Line 240,243,244"
    
  REQ-AUDIO-004:
    id: "REQ-AUDIO-004"
    name: "Set Volume"
    description: "Adjust audio volume (0-100)"
    priority: "MEDIUM"
    source: "PLAN.md Line 233"
    
  REQ-AUDIO-005:
    id: "REQ-AUDIO-005"
    name: "Preload Audio Files"
    description: "Preload beep.mp3, countdown.mp3, complete.mp3 at app init"
    priority: "HIGH"
    source: "PLAN.md Line 94"
    
  REQ-AUDIO-006:
    id: "REQ-AUDIO-006"
    name: "Exercise Start Announcement"
    description: "Speak '开始：{动作名称}' when exercise starts"
    priority: "HIGH"
    source: "PLAN.md Line 240"
    
  REQ-AUDIO-007:
    id: "REQ-AUDIO-007"
    name: "Exercise Complete Announcement"
    description: "Speak '动作完成，休息5秒' when exercise ends"
    priority: "HIGH"
    source: "PLAN.md Line 243"
    
  REQ-AUDIO-008:
    id: "REQ-AUDIO-008"
    name: "Rest End Announcement"
    description: "Speak '准备下一个动作' when rest ends"
    priority: "HIGH"
    source: "PLAN.md Line 244"
    
  REQ-AUDIO-009:
    id: "REQ-AUDIO-009"
    name: "Workout Complete Announcement"
    description: "Speak '训练完成，真棒！' when workout completes"
    priority: "HIGH"
    source: "PLAN.md Line 244"
    
  REQ-AUDIO-010:
    id: "REQ-AUDIO-010"
    name: "Mute/Unmute Toggle"
    description: "Toggle mute state (double-tap gesture)"
    priority: "MEDIUM"
    source: "PLAN.md Line 253"

# =============================================================================
# User Stories
# =============================================================================
user_stories:
  US-TIMER-001:
    id: "US-TIMER-001"
    role: "runner"
    action: "start countdown timer for exercise"
    benefit: "track my exercise duration accurately"
    requirements: ["REQ-TIMER-001", "REQ-TIMER-005", "REQ-TIMER-006"]
    
  US-TIMER-002:
    id: "US-TIMER-002"
    role: "runner"
    action: "pause timer during exercise"
    benefit: "take a break if needed without losing progress"
    requirements: ["REQ-TIMER-002", "REQ-TIMER-008", "REQ-TIMER-009"]
    
  US-TIMER-003:
    id: "US-TIMER-003"
    role: "runner"
    action: "resume paused timer"
    benefit: "continue training from where I paused"
    requirements: ["REQ-TIMER-003", "REQ-TIMER-008"]
    
  US-TIMER-004:
    id: "US-TIMER-004"
    role: "runner"
    action: "get countdown updates"
    benefit: "see real-time countdown on screen"
    requirements: ["REQ-TIMER-005", "REQ-TIMER-008"]
    
  US-AUDIO-001:
    id: "US-AUDIO-001"
    role: "runner"
    action: "hear beep sound each second"
    benefit: "know time is progressing without looking at screen"
    requirements: ["REQ-AUDIO-001", "REQ-AUDIO-004"]
    
  US-AUDIO-002:
    id: "US-AUDIO-002"
    role: "runner"
    action: "hear voice countdown for last 5 seconds"
    benefit: "know exactly when exercise will end"
    requirements: ["REQ-AUDIO-002", "REQ-AUDIO-005"]
    
  US-AUDIO-003:
    id: "US-AUDIO-003"
    role: "runner"
    action: "hear exercise announcements"
    benefit: "know what's happening without reading text"
    requirements: ["REQ-AUDIO-003", "REQ-AUDIO-006", "REQ-AUDIO-007", "REQ-AUDIO-008", "REQ-AUDIO-009"]

