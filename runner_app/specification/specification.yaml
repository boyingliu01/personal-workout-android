        - "REQ-TIMER-005: stream emission test"
        - "REQ-TIMER-006: Stopwatch usage test"
        - "REQ-TIMER-007: onComplete callback test"
        - "REQ-TIMER-008: remainingSeconds getter test"
        - "REQ-TIMER-009: status getter test"
