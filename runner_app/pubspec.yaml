name: strength_app
description: "个人力量训练APP - 专注于跑者的力量训练"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  audioplayers: ^6.6.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.0
  flutter_tts: ^4.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  riverpod_annotation: ^2.6.0
  wakelock_plus: ^1.2.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  riverpod_generator: ^2.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/tick.wav
    - assets/animations/
