# Specification: 训练中断恢复功能
# Generated from Delphi review consensus
# Date: 2026-09-16

feature:
  name: 训练中断恢复
  version: 1.0.0
  priority: High
  status: approved

requirements:
  - id: REQ-001
    title: 恢复中断的训练
    description: 当用户训练中断后点击"继续"，应从上次中断的动作继续，而不是重新开始
    priority: Must
    status: approved

  - id: REQ-002
    title: Workout 查找容错
    description: 使用 firstWhereOrNull 或 orElse 处理 workout 找不到的情况，避免抛异常
    priority: Must
    status: approved

  - id: REQ-003
    title: 中心记录清理时序
    description: 调整 resumeInterruptedSession() 时序：恢复 → 训练完成 → 清除记录，避免崩溃导致数据丢失
    priority: Must
    status: approved

  - id: REQ-004
    title: Workout 不存在的 Fallback
    description: 当 workout 找不到时，清除中断记录并提示用户
    priority: Should
    status: approved

user_stories:
  - id: US-001
    title: 训练中断后继续
    description: 作为用户，我希望训练中断后能从上次中断的动作继续，而不是重新开始
    acceptance_criteria:
      - 点击"继续"后，训练从上次中断的动作开始
      - 进度点显示正确的当前位置
      - 倒计时从头开始（不是从上次剩余时间）
      - 训练完成后正常保存记录

  - id: US-002
    title: Workout 不存在时的处理
    description: 作为用户，如果训练模块被删除，我希望看到友好提示而不是崩溃
    acceptance_criteria:
      - 显示"训练模块不存在"提示
      - 自动清除中断记录
      - 返回首页

technical_spec:
  files_to_modify:
    - runner_app/lib/presentation/screens/home_screen.dart
    - runner_app/lib/presentation/providers/training_session_provider.dart

  implementation_details:
    - home_screen.dart: 在"继续"按钮的 onPressed 中，用 workoutId 从 ExerciseData.allWorkouts 查找 workout
    - home_screen.dart: 使用 firstWhereOrNull 或 orElse 处理找不到的情况
    - home_screen.dart: 调用 selectWorkout() 加载 workout，然后调用 resumeInterruptedSession()
    - training_session_provider.dart: 调整 resumeInterruptedSession() 不清除记录，改为在训练完成时清除

  dependencies:
    - ExerciseData.allWorkouts (静态数据)
    - TrainingStorage.getInterruptedSession()
    - TrainingSessionNotifier.selectWorkout()
    - TrainingSessionNotifier.resumeInterruptedSession()

test_scenarios:
  - id: TC-001
    title: 正常恢复训练
    description: 中断训练后点击"继续"，验证从正确动作开始
    steps:
      - 开始训练，完成前 2 个动作
      - 退出训练（触发中断保存）
      - 重新打开 app，点击"继续"
    expected: 训练从第 3 个动作开始

  - id: TC-002
    title: Workout 不存在时的处理
    description: 模拟 workout 被删除的情况，验证 fallback 逻辑
    steps:
      - 中断训练
      - 修改中断记录中的 workoutId 为不存在的值
      - 重新打开 app，点击"继续"
    expected: 显示提示，清除记录，返回首页

  - id: TC-003
    title: 训练完成后清除中断记录
    description: 验证训练正常完成后才清除中断记录
    steps:
      - 中断训练
      - 恢复训练
      - 完成所有动作
    expected: 中断记录被清除，历史记录中保存完整训练记录

acceptance_criteria:
  - 所有测试场景通过
  - 代码审查通过
  - 用户验收通过

delphi_review:
  round: 2
  verdict: APPROVED_WITH_MINOR
  confidence: 9
  critical_issues: 0
  major_concerns: 2 (resolved)
  minor_concerns: 2 (resolved)
  consensus_rate: 100%
